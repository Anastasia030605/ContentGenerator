services:
  app:
    build: .
    container_name: content-generator

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    volumes:
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      ollama:
        condition: service_healthy  

    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      sleep 10 &&
      ollama pull llama3.2:3b &&
      wait"

volumes:
  ollama_data:
  huggingface_cache: